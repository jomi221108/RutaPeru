server.port=8080

# --- Base de datos MySQL local ---
# Usuario y base creados por database/rutaperu_db.sql
spring.datasource.url=jdbc:mysql://localhost:3306/rutaperu_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=rutaperu_user
spring.datasource.password=RutaPeru2026!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

